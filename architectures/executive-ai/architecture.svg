<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Executive AI Reference Architecture</title>
  <desc id="desc">High-level architecture showing executive requests, orchestration, access checks, specialist agents, enterprise sources, human approval and audit logging.</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="60" y="70" fill="#f8efe1" font-family="Arial, sans-serif" font-size="34" font-weight="700">Executive AI</text>
  <text x="60" y="105" fill="#d7bd7f" font-family="Arial, sans-serif" font-size="18">Decision support with source-backed briefs and human authority</text>
  <g fill="#10223a" stroke="#d7bd7f" stroke-width="2">
    <rect x="70" y="170" width="180" height="70" rx="14"/>
    <rect x="310" y="170" width="190" height="70" rx="14"/>
    <rect x="560" y="170" width="210" height="70" rx="14"/>
    <rect x="830" y="170" width="190" height="70" rx="14"/>
    <rect x="210" y="430" width="170" height="70" rx="14"/>
    <rect x="430" y="430" width="170" height="70" rx="14"/>
    <rect x="650" y="430" width="170" height="70" rx="14"/>
    <rect x="870" y="430" width="170" height="70" rx="14"/>
    <rect x="560" y="565" width="210" height="70" rx="14"/>
  </g>
  <g fill="#f8efe1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="160" y="212">Executive</text>
    <text x="405" y="212">Brief Request</text>
    <text x="665" y="202">Access and</text>
    <text x="665" y="222">Purpose Checks</text>
    <text x="925" y="212">AI Orchestrator</text>
    <text x="295" y="472">Reporting</text>
    <text x="515" y="472">Risk Detection</text>
    <text x="735" y="472">Knowledge</text>
    <text x="955" y="472">Follow-up</text>
    <text x="665" y="607">Human Approval</text>
  </g>
  <g stroke="#d7bd7f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 205 H310"/>
    <path d="M500 205 H560"/>
    <path d="M770 205 H830"/>
    <path d="M925 240 V350 H295 V430"/>
    <path d="M925 240 V350 H515 V430"/>
    <path d="M925 240 V350 H735 V430"/>
    <path d="M925 240 V350 H955 V430"/>
    <path d="M925 240 V600 H770"/>
  </g>
  <text x="60" y="660" fill="#aab6c5" font-family="Arial, sans-serif" font-size="14">Reference SVG. Source Mermaid diagram is available in architecture.mmd.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7bd7f"/>
    </marker>
  </defs>
</svg>
