<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Yachting AI Operating System Reference Architecture</title>
  <desc id="desc">High-level architecture showing channels, policy checks, orchestration, specialist agents, enterprise systems, human approval and audit logging.</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <text x="60" y="70" fill="#f8efe1" font-family="Arial, sans-serif" font-size="34" font-weight="700">Yachting AI Operating System</text>
  <text x="60" y="105" fill="#d7bd7f" font-family="Arial, sans-serif" font-size="18">Secure agentic workflow with human approval for sensitive actions</text>
  <g fill="#10223a" stroke="#d7bd7f" stroke-width="2">
    <rect x="60" y="170" width="190" height="70" rx="14"/>
    <rect x="310" y="170" width="190" height="70" rx="14"/>
    <rect x="560" y="170" width="190" height="70" rx="14"/>
    <rect x="810" y="170" width="190" height="70" rx="14"/>
    <rect x="560" y="330" width="190" height="70" rx="14"/>
    <rect x="120" y="500" width="170" height="70" rx="14"/>
    <rect x="330" y="500" width="170" height="70" rx="14"/>
    <rect x="540" y="500" width="170" height="70" rx="14"/>
    <rect x="750" y="500" width="170" height="70" rx="14"/>
    <rect x="960" y="500" width="170" height="70" rx="14"/>
  </g>
  <g fill="#f8efe1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <text x="155" y="212">Client Channels</text>
    <text x="405" y="212">Intake Agent</text>
    <text x="655" y="202">Policy and</text>
    <text x="655" y="222">Consent Checks</text>
    <text x="905" y="212">AI Orchestrator</text>
    <text x="655" y="372">Human Approval</text>
    <text x="205" y="542">Client Memory</text>
    <text x="415" y="542">Yacht Matching</text>
    <text x="625" y="542">Documents</text>
    <text x="835" y="542">CRM</text>
    <text x="1045" y="542">Reporting</text>
  </g>
  <g stroke="#d7bd7f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 205 H310"/>
    <path d="M500 205 H560"/>
    <path d="M750 205 H810"/>
    <path d="M905 240 V330 H750"/>
    <path d="M905 240 V470 H205 V500"/>
    <path d="M905 240 V470 H415 V500"/>
    <path d="M905 240 V470 H625 V500"/>
    <path d="M905 240 V470 H835 V500"/>
    <path d="M905 240 V470 H1045 V500"/>
  </g>
  <text x="60" y="660" fill="#aab6c5" font-family="Arial, sans-serif" font-size="14">Reference SVG. Source Mermaid diagram is available in architecture.mmd.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d7bd7f"/>
    </marker>
  </defs>
</svg>
